[workspace]
members = [
    "crates/domain",
    "crates/event-journal",
    "crates/persistence",
    "crates/project-documents",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
